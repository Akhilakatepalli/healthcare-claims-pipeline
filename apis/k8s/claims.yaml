apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims
  template:
    metadata:
      labels:
        app: claims
    spec:
      containers:
        - name: claims
          image: us-central1-docker.pkg.dev/mongodb-gke-project/healthcare-apis/claims:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: uri
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: claims-service
spec:
  type: LoadBalancer
  selector:
    app: claims
  ports:
    - port: 80
      targetPort: 8080
