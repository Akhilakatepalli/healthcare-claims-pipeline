name: Build and Deploy to GKE

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: healthcare-apis

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push eligibility API
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/$REPOSITORY/eligibility:$GITHUB_SHA \
            -f apis/eligibility/Dockerfile apis/
          docker push $REGISTRY/$PROJECT_ID/$REPOSITORY/eligibility:$GITHUB_SHA

      - name: Build and push claims API
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/$REPOSITORY/claims:$GITHUB_SHA \
            -f apis/claims/Dockerfile apis/
          docker push $REGISTRY/$PROJECT_ID/$REPOSITORY/claims:$GITHUB_SHA

      - name: Build and push reconciliation API
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/$REPOSITORY/reconciliation:$GITHUB_SHA \
            -f apis/reconciliation/Dockerfile apis/
          docker push $REGISTRY/$PROJECT_ID/$REPOSITORY/reconciliation:$GITHUB_SHA

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials healthcare-cluster \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

      - name: Deploy to GKE
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: |
          kubectl set image deployment/eligibility-deployment \
            eligibility=$REGISTRY/$PROJECT_ID/$REPOSITORY/eligibility:$GITHUB_SHA
          kubectl set image deployment/claims-deployment \
            claims=$REGISTRY/$PROJECT_ID/$REPOSITORY/claims:$GITHUB_SHA
          kubectl set image deployment/reconciliation-deployment \
            reconciliation=$REGISTRY/$PROJECT_ID/$REPOSITORY/reconciliation:$GITHUB_SHA
          kubectl rollout status deployment/eligibility-deployment
          kubectl rollout status deployment/claims-deployment
          kubectl rollout status deployment/reconciliation-deployment
