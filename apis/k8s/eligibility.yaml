apiVersion: apps/v1
kind: Deployment
metadata:
  name: eligibility-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eligibility
  template:
    metadata:
      labels:
        app: eligibility
    spec:
      containers:
        - name: eligibility
          image: us-central1-docker.pkg.dev/mongodb-gke-project/healthcare-apis/eligibility:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: uri
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eligibility-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: eligibility
  ports:
    - port: 80
      targetPort: 8080
